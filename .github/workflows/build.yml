name: Build and deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "17 6 * * *"
  repository_dispatch:
    types: [docs]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  discover-sources:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.read.outputs.sources }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        run: echo "sources=$(jq -c '.sources' repos.json)" >> "$GITHUB_OUTPUT"

  fetch-sources:
    needs: discover-sources
    runs-on: ubuntu-latest
    strategy:
      matrix:
        source: ${{ fromJson(needs.discover-sources.outputs.sources) }}
    steps:
      # fetch-depth: 0 pulls full history, not just the tip commit: the
      # changelog generator runs git-cliff over each repo's full Conventional
      # Commit history, which a shallow checkout can't give it.
      - uses: actions/checkout@v5
        with:
          repository: ${{ matrix.source.repo }}
          path: .sources/${{ matrix.source.id }}
          fetch-depth: 0
      - uses: actions/upload-artifact@v7
        with:
          name: source-${{ matrix.source.id }}
          path: .sources/${{ matrix.source.id }}
          include-hidden-files: true

  build:
    needs: fetch-sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: source-*
          path: .sources
          merge-multiple: false
      - name: flatten downloaded sources
        run: |
          set -eu
          for dir in .sources/source-*; do
            id="${dir#.sources/source-}"
            mv "$dir" ".sources/$id"
          done
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: check whether the companion app has shipped
        id: companion
        run: |
          if [ -f .sources/companion/Cargo.toml ]; then
            echo "shipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "shipped=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.companion.outputs.shipped == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.companion.outputs.shipped == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".sources/companion -> target"
      - run: uv run python scripts/generate_developer_pages.py
      - run: uv run python scripts/generate_api_reference.py
      - run: uv run python scripts/generate_bot_commands.py
      - run: uv run python scripts/generate_addon_reference.py
      - run: uv run python scripts/generate_companion_reference.py
      - run: uv run python scripts/generate_changelogs.py
      - run: uv run sphinx-build -b html source _build/html -W
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

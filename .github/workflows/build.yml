name: Build and deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "17 6 * * *"
  repository_dispatch:
    types: [docs]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  discover-sources:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sources: ${{ steps.read.outputs.sources }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: read
        run: echo "sources=$(jq -c '.sources' repos.json)" >> "$GITHUB_OUTPUT"

  fetch-sources:
    needs: discover-sources
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        source: ${{ fromJson(needs.discover-sources.outputs.sources) }}
    steps:
      # fetch-depth: 0 pulls full history, not just the tip commit: the
      # changelog generator runs git-cliff over each repo's full Conventional
      # Commit history, which a shallow checkout can't give it.
      # persist-credentials: false keeps the job's token out of .git/config, which is uploaded below.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ matrix.source.repo }}
          path: .sources/${{ matrix.source.id }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-${{ matrix.source.id }}
          path: .sources/${{ matrix.source.id }}
          include-hidden-files: true

  build:
    needs: fetch-sources
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: source-*
          path: .sources
          merge-multiple: false
      - name: flatten downloaded sources
        run: |
          set -eu
          for dir in .sources/source-*; do
            id="${dir#.sources/source-}"
            mv "$dir" ".sources/$id"
          done
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync
      - name: install git-cliff
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: git-cliff
      - name: check whether the companion app has shipped
        id: companion
        run: |
          if [ -f .sources/companion/Cargo.toml ]; then
            echo "shipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "shipped=false" >> "$GITHUB_OUTPUT"
          fi
      # cargo doc runs the build scripts of the companion's GPUI dependencies, which need these system libraries on
      # Linux. Same list as the companion's own CI.
      - name: install the companion's Linux build dependencies
        if: steps.companion.outputs.shipped == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            gcc g++ libasound2-dev libfontconfig-dev libgit2-dev libglib2.0-dev libssl-dev libva-dev libvulkan1 \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev make cmake clang lld llvm jq curl \
            gettext-base elfutils libsqlite3-dev build-essential pipewire xdg-desktop-portal libstdc++-14-dev
      - if: steps.companion.outputs.shipped == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - if: steps.companion.outputs.shipped == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ".sources/companion -> target"
      - run: uv run python scripts/generate_developer_pages.py
      - run: uv run python scripts/generate_api_reference.py
      - run: uv run python scripts/generate_bot_commands.py
      - run: uv run python scripts/generate_addon_reference.py
      - run: uv run python scripts/generate_companion_reference.py
      - run: uv run python scripts/generate_changelogs.py
      - run: uv run sphinx-build -b html source _build/html -W
      # v5 pins its own upload-artifact to a commit; v3 used a tag, which the org's pinned-actions rule rejects.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write # deploy-pages proves the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

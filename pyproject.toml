[project]
name = "sidequest-docs"
version = "0.1.0"
description = "Documentation for SideQuest, an Alliance guild on World of Warcraft: Forever"
requires-python = ">=3.15,<4.0"
license = { text = "MIT" }
dependencies = [
  "sphinx==8.2.3",
  "shibuya==2026.7.12",
  "myst-parser==4.0.1",
  "sphinxcontrib-mermaid==1.0.0",
  "sphinx-design==0.7.0",
  "sphinx-autoapi==3.6.0",
  "httpx==0.28.1",
  "astroid==3.3.11",
  "sphinx-copybutton==0.5.2",
  "sphinx-iconify==0.3.0",
  "sphinx-notfound-page==1.1.0",
]

[dependency-groups]
dev = ["sphinx-autobuild==2025.8.25"]

[tool.uv]
package = false
